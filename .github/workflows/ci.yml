# On every push: typecheck and unit tests. The dry-run of every app version against the real releases runs in
# xb00tt/revamp-patches, where the official bundle lives.
name: CI
on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
